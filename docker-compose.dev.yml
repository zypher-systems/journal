# Development: just the database, reachable only from this machine.
# Run the app on the host with `npm run dev`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U journal -d journal']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata_dev:
