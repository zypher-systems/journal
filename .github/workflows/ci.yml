# Type-check, build the image, smoke-test it as compose runs it, then publish
# to GHCR from dev, main and release tags. Pull requests and patch branches
# get the same checks without publishing.
name: CI

on:
  push:
    branches: [main, dev, '*-patch', '*-hotfix']
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    name: Image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: journal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the compose stack
        env:
          JOURNAL_IMAGE: journal:ci
          POSTGRES_PASSWORD: ${{ github.run_id }}ci
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD: smoketest1
          ORIGIN: http://127.0.0.1:3000
        run: docker compose up -d --wait --wait-timeout 180

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
          ORIGIN: http://127.0.0.1:3000
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD: smoketest1
        run: npm test

      - name: App log
        if: failure()
        run: docker compose logs app db
        env:
          POSTGRES_PASSWORD: unused

      - name: Image tags
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # dev → :dev, main → :main, v1.2.3 → :1.2.3 :1.2 :latest; every push also :sha-xxxxxxx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUBLISH == 'true'
        with:
          platforms: arm64

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
