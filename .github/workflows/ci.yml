# Type-check, build the image, and smoke-test it as compose runs it.
# Pushes to dev publish the tested image (:dev and :sha-xxxxxxx); a release
# tag then promotes that exact image to :X.Y.Z, :X.Y and :latest instead of
# rebuilding it. main isn't built on push: it only takes commits that already
# passed here. Hotfix branches publish by commit only, so their release tag
# has an image to promote. Pull requests and patch branches get the checks
# without publishing. Standard hosted runners only.
name: CI

on:
  push:
    branches: [dev, '*-patch', '*-hotfix']
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    name: Image
    if: github.ref_type != 'tag'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || endsWith(github.ref, '-hotfix')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: journal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the compose stack
        env:
          JOURNAL_IMAGE: journal:ci
          POSTGRES_PASSWORD: ${{ github.run_id }}ci
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD: smoketest1
          ORIGIN: http://127.0.0.1:3000
        run: docker compose up -d --wait --wait-timeout 180

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
          ORIGIN: http://127.0.0.1:3000
          ADMIN_EMAIL: smoke@example.com
          ADMIN_PASSWORD: smoketest1
        run: npm test

      - name: App log
        if: failure()
        run: docker compose logs app db
        env:
          POSTGRES_PASSWORD: unused

      - name: Version
        id: version
        if: env.PUBLISH == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # dev → :dev; every published push → :sha-xxxxxxx, which a release tag promotes
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
          # The package.json version, so a promoted release image already says what it is
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUBLISH == 'true'
        with:
          platforms: arm64

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json
        run: |
          want="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $want."
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          source="$IMAGE:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$source" > /dev/null; then
            echo "::error::No published image for ${GITHUB_SHA::7}. Tag a commit that passed CI on dev (or a hotfix branch)."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:${version%.*}" \
            --tag "$IMAGE:latest" \
            "$source"
