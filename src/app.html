<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				try {
					const cookie = document.cookie.split('; ').find((r) => r.startsWith('journal-theme='));
					const fromCookie = cookie ? decodeURIComponent(cookie.split('=').slice(1).join('=')) : '';
					const t = fromCookie || localStorage.getItem('journal-theme') || 'system';
					const dark =
						t === 'dark' ||
						((t === 'system' || !t) && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {
					/* noop */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
